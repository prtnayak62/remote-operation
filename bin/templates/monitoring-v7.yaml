AWSTemplateFormatVersion: '2010-09-09'
Description: 'Service-Type Specific Monitoring and Alarms (v7)'

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Description: Environment name
  
  ServiceName:
    Type: String
    Description: Name of the microservice
  
  ServiceType:
    Type: String
    AllowedValues: [api, kafka-consumer, sqs-sns-worker, internal-service, batch-job]
    Description: Type of service

Conditions:
  IsProduction: !Equals [!Ref Environment, 'prod']
  IsAPIService: !Equals [!Ref ServiceType, 'api']
  IsKafkaConsumer: !Equals [!Ref ServiceType, 'kafka-consumer']
  IsSQSSNSWorker: !Equals [!Ref ServiceType, 'sqs-sns-worker']
  IsInternalService: !Equals [!Ref ServiceType, 'internal-service']
  IsBatchJob: !Equals [!Ref ServiceType, 'batch-job']
  IsNotBatchJob: !Not [!Equals [!Ref ServiceType, 'batch-job']]
  NeedsHighFrequencyMonitoring: !Equals [!Ref ServiceType, 'api']

Resources:
  # CPU Utilization Alarm (all service types except batch)
  CPUUtilizationAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsNotBatchJob
    Properties:
      AlarmName: !Sub '${Environment}-${ServiceName}-high-cpu'
      AlarmDescription: !Sub 'High CPU utilization for ${ServiceName} ${ServiceType} service'
      MetricName: CPUUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: !If [NeedsHighFrequencyMonitoring, 60, 300]
      EvaluationPeriods: !If [NeedsHighFrequencyMonitoring, 2, 3]
      Threshold: !If [IsAPIService, 80, 85]
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Sub '${Environment}-${ServiceName}'
        - Name: ClusterName
          Value: !Sub '${Environment}-microservices'
      TreatMissingData: notBreaching

  # Memory Utilization Alarm
  MemoryUtilizationAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsNotBatchJob
    Properties:
      AlarmName: !Sub '${Environment}-${ServiceName}-high-memory'
      AlarmDescription: !Sub 'High memory utilization for ${ServiceName} ${ServiceType} service'
      MetricName: MemoryUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: !If [NeedsHighFrequencyMonitoring, 60, 300]
      EvaluationPeriods: !If [NeedsHighFrequencyMonitoring, 2, 3]
      Threshold: !If [IsAPIService, 85, 90]
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Sub '${Environment}-${ServiceName}'
        - Name: ClusterName
          Value: !Sub '${Environment}-microservices'
      TreatMissingData: notBreaching

  # Service Running Tasks Alarm (critical for all services)
  RunningTasksAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsNotBatchJob
    Properties:
      AlarmName: !Sub '${Environment}-${ServiceName}-no-running-tasks'
      AlarmDescription: !Sub 'No running tasks for ${ServiceName} ${ServiceType} service'
      MetricName: RunningTaskCount
      Namespace: AWS/ECS
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Sub '${Environment}-${ServiceName}'
        - Name: ClusterName
          Value: !Sub '${Environment}-microservices'
      TreatMissingData: breaching

  # Custom CloudWatch Dashboard
  ServiceDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${Environment}-${ServiceName}-${ServiceType}'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/ECS", "CPUUtilization", "ServiceName", "${Environment}-${ServiceName}", "ClusterName", "${Environment}-microservices" ],
                  [ ".", "MemoryUtilization", ".", ".", ".", "." ]
                ],
                "period": 300,
                "stat": "Average",
                "region": "${AWS::Region}",
                "title": "${ServiceName} Resource Utilization"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/ECS", "RunningTaskCount", "ServiceName", "${Environment}-${ServiceName}", "ClusterName", "${Environment}-microservices" ]
                ],
                "period": 300,
                "stat": "Average",
                "region": "${AWS::Region}",
                "title": "${ServiceName} Running Tasks"
              }
            }
          ]
        }

Outputs:
  DashboardURL:
    Description: CloudWatch Dashboard URL
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Environment}-${ServiceName}-${ServiceType}'
    Export:
      Name: !Sub '${Environment}-${ServiceName}-DashboardURL'