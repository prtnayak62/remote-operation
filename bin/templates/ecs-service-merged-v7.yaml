AWSTemplateFormatVersion: '2010-09-09'
Description: 'ECS Service with Task Definition - Service Type Optimized (v7)'

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Description: Environment name
  
  ServiceName:
    Type: String
    Description: Name of the microservice
  
  ServiceType:
    Type: String
    AllowedValues: [api, kafka-consumer, sqs-sns-worker, internal-service, batch-job]
    Description: Type of service
  
  ContainerImage:
    Type: String
    Description: Container image URI
  
  ContainerPort:
    Type: Number
    Default: 8080
    Description: Port that the container listens on
  
  HealthCheckPath:
    Type: String
    Default: '/health'
    Description: Health check path for HTTP health checks
  
  HealthCheckProtocol:
    Type: String
    AllowedValues: [HTTP, TCP, NONE]
    Default: HTTP
    Description: Health check protocol
  
  # Service-type specific scaling parameters
  DesiredCount:
    Type: Number
    Default: 1
    Description: Desired number of tasks
  
  MinCapacity:
    Type: Number
    Default: 1
    Description: Minimum capacity for auto scaling
  
  MaxCapacity:
    Type: Number
    Default: 10
    Description: Maximum capacity for auto scaling
  
  # Resource allocation based on service type
  TaskCpu:
    Type: Number
    Default: 512
    Description: CPU units for the task
  
  TaskMemory:
    Type: Number
    Default: 1024
    Description: Memory (MB) for the task
  
  CpuArchitecture:
    Type: String
    AllowedValues: [X86_64, ARM64]
    Default: X86_64
    Description: CPU architecture
  
  # Optional resource access parameters (any service type can use any resource)
  NeedsMSK:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Does this service need MSK access?
  
  NeedsSQS:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Does this service need SQS access?
  
  NeedsSNS:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Does this service need SNS access?
  
  NeedsDatabase:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Does this service need Database access?
  
  NeedsRedis:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Does this service need Redis access?
  
  NeedsDynamoDB:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Does this service need DynamoDB/DAX access?
  
  DatabaseUser:
    Type: String
    Default: 'postgres'
    Description: Database username for connection

Conditions:
  IsProduction: !Equals [!Ref Environment, 'prod']
  IsAPIService: !Equals [!Ref ServiceType, 'api']
  IsKafkaConsumer: !Equals [!Ref ServiceType, 'kafka-consumer']
  IsBatchJob: !Equals [!Ref ServiceType, 'batch-job']
  IsNotBatchJob: !Not [!Equals [!Ref ServiceType, 'batch-job']]
  HasHTTPHealthCheck: !Equals [!Ref HealthCheckProtocol, 'HTTP']
  HasTCPHealthCheck: !Equals [!Ref HealthCheckProtocol, 'TCP']
  HasNoHealthCheck: !Equals [!Ref HealthCheckProtocol, 'NONE']
  NeedsLoadBalancer: !Equals [!Ref ServiceType, 'api']
  NeedsServiceConnect: !Or [!Equals [!Ref ServiceType, 'api'], !Equals [!Ref ServiceType, 'internal-service']]
  EnableXRayDaemonSidecar: !Not [!Equals [!Ref ServiceType, 'batch-job']]
  RequiresMSK: !Equals [!Ref NeedsMSK, 'true']
  RequiresSQS: !Equals [!Ref NeedsSQS, 'true']
  RequiresSNS: !Equals [!Ref NeedsSNS, 'true']
  RequiresDatabase: !Equals [!Ref NeedsDatabase, 'true']
  RequiresRedis: !Equals [!Ref NeedsRedis, 'true']
  RequiresDynamoDB: !Equals [!Ref NeedsDynamoDB, 'true']
  CanScale: !And [!Not [!Equals [!Ref ServiceType, 'batch-job']], !Not [!Equals [!Ref ServiceType, 'kafka-consumer']]]

Resources:
  # Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Environment}-${ServiceName}'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        CpuArchitecture: !Ref CpuArchitecture
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !ImportValue
        Fn::Sub: '${Environment}-TaskExecutionRoleArn'
      TaskRoleArn: !ImportValue
        Fn::Sub: '${Environment}-${ServiceName}-TaskRoleArn-v7'
      ContainerDefinitions:
        # Main Application Container
        - Name: !Ref ServiceName
          Image: !Ref ContainerImage
          Essential: true
          Cpu: !If [IsBatchJob, !Ref TaskCpu, !Ref 'AWS::NoValue']
          Memory: !If [IsBatchJob, !Ref TaskMemory, !Ref 'AWS::NoValue']
          MemoryReservation: !If [IsBatchJob, !Ref 'AWS::NoValue', !Ref TaskMemory]
          ReadonlyRootFilesystem: !If [IsProduction, true, false]
          User: !If [IsProduction, '1001:1001', !Ref 'AWS::NoValue']
          PortMappings: !If
            - HasNoHealthCheck
            - !Ref 'AWS::NoValue'
            - - ContainerPort: !Ref ContainerPort
                Protocol: tcp
                Name: !Sub '${ServiceName}-port'
          # HealthCheck: !If
          #   - HasHTTPHealthCheck
          #   - Command:
          #       - CMD-SHELL
          #       - !Sub 'curl -f http://localhost:${ContainerPort}${HealthCheckPath} || exit 1'
          #     Interval: 30
          #     Timeout: 5
          #     Retries: 3
          #     StartPeriod: 60
          #   - !If
          #     - HasTCPHealthCheck
          #     - Command:
          #         - CMD-SHELL
          #         - !Sub 'nc -z localhost ${ContainerPort} || exit 1'
          #       Interval: 30
          #       Timeout: 5
          #       Retries: 3
          #       StartPeriod: 30
          #     - !Ref 'AWS::NoValue'
          Environment:
            # Common environment variables
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: SERVICE_NAME
              Value: !Ref ServiceName
            - Name: SERVICE_TYPE
              Value: !Ref ServiceType
            - Name: SERVICE_PORT
              Value: !Ref ContainerPort
            - Name: AWS_REGION
              Value: !Ref 'AWS::Region'
            - Name: AWS_XRAY_DAEMON_ADDRESS
              Value: !If [EnableXRayDaemonSidecar, 'localhost:2000', !Ref 'AWS::NoValue']
            - Name: AWS_XRAY_TRACING_NAME
              Value: !Ref ServiceName
            
            # Resource-based environment variables (any service type can use any resource)
            # Database environments (if NeedsDatabase=true)
            - !If
              - RequiresDatabase
              - Name: DATABASE_ENDPOINT
                Value: !ImportValue
                  Fn::Sub: '${Environment}-DatabaseEndpoint'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresDatabase
              - Name: DATABASE_NAME
                Value: !ImportValue
                  Fn::Sub: '${Environment}-DatabaseName'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresDatabase
              - Name: DATABASE_PORT
                Value: !ImportValue
                  Fn::Sub: '${Environment}-DatabasePort'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresDatabase
              - Name: DATABASE_USER
                Value: !Ref DatabaseUser
              - !Ref 'AWS::NoValue'
            
            # Redis environments (if NeedsRedis=true)
            - !If
              - RequiresRedis
              - Name: REDIS_ENDPOINT
                Value: !ImportValue
                  Fn::Sub: '${Environment}-RedisEndpoint'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresRedis
              - Name: REDIS_PORT
                Value: '6379'
              - !Ref 'AWS::NoValue'
            
            # DynamoDB/DAX environments (if NeedsDynamoDB=true)
            - !If
              - RequiresDynamoDB
              - Name: DAX_ENDPOINT
                Value: !ImportValue
                  Fn::Sub: '${Environment}-DAXClusterEndpoint'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresDynamoDB
              - Name: DYNAMODB_REGION
                Value: !Ref 'AWS::Region'
              - !Ref 'AWS::NoValue'
            
            # MSK environments (if NeedsMSK=true)
            # - !If
            #   - RequiresMSK
            #   - Name: MSK_BOOTSTRAP_SERVERS
            #     Value: !ImportValue
            #       Fn::Sub: '${Environment}-MSKBootstrapServers'
            #   - !Ref 'AWS::NoValue'
            - !If
              - RequiresMSK
              - Name: MSK_CLUSTER_ARN
                Value: !ImportValue
                  Fn::Sub: '${Environment}-MSKServerlessClusterArn'
              - !Ref 'AWS::NoValue'
            
            # SQS environments (if NeedsSQS=true)
            - !If
              - RequiresSQS
              - Name: SQS_QUEUE_URL
                Value: !Sub 'https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${Environment}-${ServiceName}-queue'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresSQS
              - Name: SQS_REGION
                Value: !Ref 'AWS::Region'
              - !Ref 'AWS::NoValue'
            
            # SNS environments (if NeedsSNS=true)
            - !If
              - RequiresSNS
              - Name: SNS_TOPIC_ARN
                Value: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Environment}-${ServiceName}-topic'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresSNS
              - Name: SNS_REGION
                Value: !Ref 'AWS::Region'
              - !Ref 'AWS::NoValue'
            
            # Service-type specific environments (only for batch jobs)
            - !If
              - IsBatchJob
              - Name: BATCH_JOB_NAME
                Value: !Ref ServiceName
              - !Ref 'AWS::NoValue'
          
          Secrets: !If
            - RequiresDatabase
            - - Name: DATABASE_PASSWORD
                ValueFrom: !ImportValue
                  Fn::Sub: '${Environment}-DatabaseMasterSecretArn'
            - !Ref 'AWS::NoValue'
          
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue
                Fn::Sub: '${Environment}-ECSLogGroupName'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: !Ref ServiceName
        
        # X-Ray Daemon Sidecar (for non-batch services)
        - !If
          - EnableXRayDaemonSidecar
          - Name: xray-daemon
            Image: public.ecr.aws/xray/aws-xray-daemon:latest
            Essential: false
            Cpu: 32
            Memory: 256
            Environment:
              - Name: AWS_REGION
                Value: !Ref 'AWS::Region'
            Command:
              - '-o'
              - '-t'
              - '0.0.0.0:2000'
              - '-b'
              - '0.0.0.0:2000'
            PortMappings:
              - ContainerPort: 2000
                Protocol: udp
                Name: xray-udp
            LogConfiguration:
              LogDriver: awslogs
              Options:
                awslogs-group: !ImportValue
                  Fn::Sub: '${Environment}-ECSLogGroupName'
                awslogs-region: !Ref 'AWS::Region'
                awslogs-stream-prefix: xray-daemon
          - !Ref 'AWS::NoValue'
      
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-${ServiceName}-task'
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceName
        - Key: ServiceType
          Value: !Ref ServiceType
        - Key: Version
          Value: v7

  # ECS Service (not created for batch jobs)
  ECSService:
    Type: AWS::ECS::Service
    Condition: IsNotBatchJob
    Properties:
      ServiceName: !Sub '${Environment}-${ServiceName}'
      Cluster: !ImportValue
        Fn::Sub: '${Environment}-ECSClusterName'
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref DesiredCount
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !ImportValue
              Fn::Sub: '${Environment}-${ServiceName}-SecurityGroupId'
          Subnets:
            - !ImportValue
              Fn::Sub: '${Environment}-PrivateSubnet1Id'
            - !ImportValue
              Fn::Sub: '${Environment}-PrivateSubnet2Id'
          AssignPublicIp: DISABLED
      
      ServiceConnectConfiguration: !If
        - NeedsServiceConnect
        - Enabled: true
          Namespace: !ImportValue
            Fn::Sub: '${Environment}-ServiceConnectNamespaceName'
          Services:
            - PortName: !Sub '${ServiceName}-port'
              DiscoveryName: !Ref ServiceName
              ClientAliases:
                - Port: !Ref ContainerPort
                  DnsName: !Ref ServiceName
        - Enabled: false
      
      LoadBalancers: !If
        - NeedsLoadBalancer
        - - TargetGroupArn: !ImportValue
              Fn::Sub: '${Environment}-${ServiceName}-TargetGroupArn'
            ContainerName: !Ref ServiceName
            ContainerPort: !Ref ContainerPort
        - !Ref 'AWS::NoValue'
      
      HealthCheckGracePeriodSeconds: !If [NeedsLoadBalancer, 300, !Ref 'AWS::NoValue']
      
      DeploymentConfiguration:
        MaximumPercent: !If [IsKafkaConsumer, 100, 200]  # Kafka consumers: rolling restart
        MinimumHealthyPercent: !If [IsProduction, !If [IsKafkaConsumer, 0, 100], 50]
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      
      EnableExecuteCommand: !If [IsProduction, false, true]
      
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-${ServiceName}-service'
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceName
        - Key: ServiceType
          Value: !Ref ServiceType
        - Key: Version
          Value: v7

  # Auto Scaling Target (service-type specific)
  AutoScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: IsNotBatchJob
    DependsOn: ECSService
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Join 
        - /
        - - service
          - !Sub ${Environment}-microservices
          - !GetAtt ECSService.Name
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: !Ref MinCapacity
      MaxCapacity: !If [IsKafkaConsumer, !Ref MinCapacity, !Ref MaxCapacity]  # Kafka consumers: fixed scaling
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'

  # CPU Scaling Policy (not for Kafka consumers - they need fixed scaling)
  CPUScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: CanScale
    DependsOn: AutoScalingTarget
    Properties:
      PolicyName: !Sub '${Environment}-${ServiceName}-cpu-scaling'
      PolicyType: TargetTrackingScaling
      ServiceNamespace: ecs
      ScalingTargetId: !Ref AutoScalingTarget
      ScalableDimension: ecs:service:DesiredCount
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !If [IsAPIService, 70, 80]  # API services: more aggressive scaling
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleOutCooldown: !If [IsAPIService, 180, 300]  # API services: faster scale out
        ScaleInCooldown: !If [IsAPIService, 300, 600]   # API services: faster scale in

  # Memory Scaling Policy
  MemoryScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: CanScale
    DependsOn: AutoScalingTarget
    Properties:
      PolicyName: !Sub '${Environment}-${ServiceName}-memory-scaling'
      PolicyType: TargetTrackingScaling
      ServiceNamespace: ecs
      ScalingTargetId: !Ref AutoScalingTarget
      ScalableDimension: ecs:service:DesiredCount
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !If [IsAPIService, 75, 85]  # API services: more aggressive scaling
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        ScaleOutCooldown: !If [IsAPIService, 180, 300]
        ScaleInCooldown: !If [IsAPIService, 300, 600]

Outputs:
  TaskDefinitionArn:
    Description: Task Definition ARN
    Value: !Ref TaskDefinition
    Export:
      Name: !Sub '${Environment}-${ServiceName}-TaskDefinitionArn'

  ECSServiceArn:
    Description: ECS Service ARN
    Value: !If [IsBatchJob, !Ref 'AWS::NoValue', !Ref ECSService]
    Export:
      Name: !Sub '${Environment}-${ServiceName}-ECSServiceArn'

  ECSServiceName:
    Description: ECS Service Name
    Value: !If [IsBatchJob, !Ref 'AWS::NoValue', !Sub '${Environment}-${ServiceName}']
    Export:
      Name: !Sub '${Environment}-${ServiceName}-ECSServiceName'