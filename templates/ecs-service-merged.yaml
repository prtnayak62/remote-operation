AWSTemplateFormatVersion: '2010-09-09'
Description: 'ECS Service with Task Definition - Domain-Driven (v1-DDD)'

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Description: Environment name
  
  ServiceName:
    Type: String
    Description: Name of the microservice
    
  DomainName:
    Type: String
    Description: Domain name (e.g., customer, payment)
    Default: ""
    
  ProductName:
    Type: String
    Description: Product name (optional)
    Default: ""
  
  ServiceType:
    Type: String
    AllowedValues: [api, kafka-consumer, sqs-sns-worker, internal-service, batch-job]
    Description: Type of service
  
  ContainerImage:
    Type: String
    Description: Container image URI
  
  ContainerPort:
    Type: Number
    Default: 8080
    Description: Port that the container listens on
  
  HealthCheckPath:
    Type: String
    Default: '/health'
    Description: Health check path for HTTP health checks
  
  HealthCheckProtocol:
    Type: String
    AllowedValues: [HTTP, TCP, NONE]
    Default: HTTP
    Description: Health check protocol
  
  # Service-type specific scaling parameters
  DesiredCount:
    Type: Number
    Default: 1
    Description: Desired number of tasks
  
  MinCapacity:
    Type: Number
    Default: 1
    Description: Minimum capacity for auto scaling
  
  MaxCapacity:
    Type: Number
    Default: 10
    Description: Maximum capacity for auto scaling
  
  # Resource allocation based on service type
  TaskCpu:
    Type: Number
    Default: 512
    Description: CPU units for the task
  
  TaskMemory:
    Type: Number
    Default: 1024
    Description: Memory (MB) for the task
  
  CpuArchitecture:
    Type: String
    AllowedValues: [X86_64, ARM64]
    Default: X86_64
    Description: CPU architecture
  
  # Optional resource access parameters (any service type can use any resource)
  NeedsMSK:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Does this service need MSK access?
  
  NeedsSQS:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Does this service need SQS access?
  
  NeedsSNS:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Does this service need SNS access?
  
  NeedsDatabase:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Does this service need Database access?
  
  NeedsRedis:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Does this service need Redis access?
  
  NeedsDynamoDB:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Does this service need DynamoDB/DAX access?
  
  NeedsEFS:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Does this service need EFS config access?
  
  # Couchbase Configuration
  NeedsCouchbase:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Does this service need Couchbase access?
  
  CouchbaseBucket:
    Type: String
    Default: "newgen"
    Description: Couchbase bucket name
  
  CouchbaseScope:
    Type: String
    Default: "dev"
    Description: Couchbase scope name
  
  CouchbaseCollection:
    Type: String
    Default: ""
    Description: Couchbase collection name
  
  CouchbaseSecretName:
    Type: String
    Default: "dev/couchbase/autoconnect/newgen/credentials"
    Description: Couchbase credentials secret name
  
  CouchbaseEndpointParam:
    Type: String
    Default: "/dev/couchbase/autoconnect/newgen/endpoint"
    Description: Couchbase endpoint SSM parameter name
  
  JWTSecretParam:
    Type: String
    Default: "/dev/jwt/secret"
    Description: JWT secret SSM parameter name
  
  DatabaseUser:
    Type: String
    Default: 'postgres'
    Description: Database username for connection
    
  ECSClusterLevel:
    Type: String
    Default: "domain"
    AllowedValues: ["foundation", "domain", "product"]
    Description: Level where ECS cluster is deployed
    
  DatabaseLevel:
    Type: String
    Default: "foundation"
    AllowedValues: ["foundation", "domain", "product"]
    Description: Level where database is deployed
    
  RedisLevel:
    Type: String
    Default: "foundation"
    AllowedValues: ["foundation", "domain", "product"]
    Description: Level where Redis is deployed
    
  MSKProducerLevel:
    Type: String
    Default: "foundation"
    AllowedValues: ["foundation", "domain", "product"]
    Description: Level where MSK producer is deployed
    
  MSKConsumerLevel:
    Type: String
    Default: "foundation"
    AllowedValues: ["foundation", "domain", "product"]
    Description: Level where MSK consumer is deployed
    
  MSKProducerClusterArn:
    Type: String
    Default: ""
    Description: Optional separate MSK cluster ARN for producer (if different from main MSK)
    
  MSKConsumerClusterArn:
    Type: String
    Default: ""
    Description: Optional separate MSK cluster ARN for consumer (if different from main MSK)
    
  ProducerTopicName1:
    Type: String
    Default: "sample-topic"
    Description: Topic name for producer
    
  ConsumerTopicName1:
    Type: String
    Default: "sample-topic"
    Description: Topic name for consumer
    
  ServiceConnectLevel:
    Type: String
    Default: "domain"
    AllowedValues: ["foundation", "domain", "product"]
    Description: Level where Service Connect namespace is deployed
    
  ECSLogGroupLevel:
    Type: String
    Default: "domain"
    AllowedValues: ["foundation", "domain", "product"]
    Description: Level where ECS log group is deployed
    
  FoundationServiceConnectNamespaceSSMPath:
    Type: String
    Default: ""
    Description: SSM parameter path for foundation Service Connect namespace ARN
    
  FoundationServiceConnectNamespaceArn:
    Type: String
    Default: ""
    Description: Foundation Service Connect namespace ARN (resolved from SSM)

Conditions:
  IsProduction: !Equals [!Ref Environment, 'prod']
  IsAPIService: !Equals [!Ref ServiceType, 'api']
  IsKafkaConsumer: !Equals [!Ref ServiceType, 'kafka-consumer']
  IsBatchJob: !Equals [!Ref ServiceType, 'batch-job']
  IsNotBatchJob: !Not [!Equals [!Ref ServiceType, 'batch-job']]
  HasHTTPHealthCheck: !Equals [!Ref HealthCheckProtocol, 'HTTP']
  HasTCPHealthCheck: !Equals [!Ref HealthCheckProtocol, 'TCP']
  HasNoHealthCheck: !Equals [!Ref HealthCheckProtocol, 'NONE']
  NeedsLoadBalancer: !Equals [!Ref ServiceType, 'api']
  NeedsServiceConnect: !Or [!Equals [!Ref ServiceType, 'api'], !Equals [!Ref ServiceType, 'internal-service'], !Equals [!Ref ServiceType, 'batch-job'], !Equals [!Ref ServiceType, 'kafka-consumer']]
  NeedsServiceConnectPortMap: !Or [!Equals [!Ref ServiceType, 'api'], !Equals [!Ref ServiceType, 'internal-service']]
  EnableXRayDaemonSidecar: !Not [!Equals [!Ref ServiceType, 'batch-job']]
  RequiresMSK: !Equals [!Ref NeedsMSK, 'true']
  RequiresSQS: !Equals [!Ref NeedsSQS, 'true']
  RequiresSNS: !Equals [!Ref NeedsSNS, 'true']
  RequiresDatabase: !Equals [!Ref NeedsDatabase, 'true']
  RequiresRedis: !Equals [!Ref NeedsRedis, 'true']
  RequiresDynamoDB: !Equals [!Ref NeedsDynamoDB, 'true']
  RequiresCouchbase: !Equals [!Ref NeedsCouchbase, 'true']
  RequiresEFS: !Equals [!Ref NeedsEFS, 'true']
  HasCouchbaseSecret: !Not [!Equals [!Ref CouchbaseSecretName, ""]]
  HasCouchbaseEndpoint: !Not [!Equals [!Ref CouchbaseEndpointParam, ""]]
  HasJWTSecret: !Not [!Equals [!Ref JWTSecretParam, ""]]
  CanScale: !Not [!Equals [!Ref ServiceType, 'batch-job']]  # All services except batch-job can scale
  HasDomainName: !Not [!Equals [!Ref DomainName, ""]]
  HasProductName: !Not [!Equals [!Ref ProductName, ""]]
  IsDomainLevel: !And [!Condition HasDomainName, !Not [!Condition HasProductName]]
  IsProductLevel: !And [!Condition HasDomainName, !Condition HasProductName]
  ECSClusterAtFoundation: !Equals [!Ref ECSClusterLevel, "foundation"]
  ECSClusterAtDomain: !Equals [!Ref ECSClusterLevel, "domain"]
  ECSClusterAtProduct: !Equals [!Ref ECSClusterLevel, "product"]
  DatabaseAtFoundation: !Equals [!Ref DatabaseLevel, "foundation"]
  DatabaseAtDomain: !Equals [!Ref DatabaseLevel, "domain"]
  DatabaseAtProduct: !Equals [!Ref DatabaseLevel, "product"]
  RedisAtFoundation: !Equals [!Ref RedisLevel, "foundation"]
  RedisAtDomain: !Equals [!Ref RedisLevel, "domain"]
  RedisAtProduct: !Equals [!Ref RedisLevel, "product"]
  MSKProducerAtFoundation: !Equals [!Ref MSKProducerLevel, "foundation"]
  MSKProducerAtDomain: !Equals [!Ref MSKProducerLevel, "domain"]
  MSKProducerAtProduct: !Equals [!Ref MSKProducerLevel, "product"]
  MSKConsumerAtFoundation: !Equals [!Ref MSKConsumerLevel, "foundation"]
  MSKConsumerAtDomain: !Equals [!Ref MSKConsumerLevel, "domain"]
  MSKConsumerAtProduct: !Equals [!Ref MSKConsumerLevel, "product"]
  ServiceConnectAtFoundation: !Equals [!Ref ServiceConnectLevel, "foundation"]
  ServiceConnectAtDomain: !Equals [!Ref ServiceConnectLevel, "domain"]
  ServiceConnectAtProduct: !Equals [!Ref ServiceConnectLevel, "product"]
  ECSLogGroupAtFoundation: !Equals [!Ref ECSLogGroupLevel, "foundation"]
  ECSLogGroupAtDomain: !Equals [!Ref ECSLogGroupLevel, "domain"]
  ECSLogGroupAtProduct: !Equals [!Ref ECSLogGroupLevel, "product"]
  UseFoundationServiceConnectNamespace: !Not [!Equals [!Ref FoundationServiceConnectNamespaceArn, ""]]
  HasSeparateProducerMSK: !Not [!Equals [!Ref MSKProducerClusterArn, ""]]
  HasSeparateConsumerMSK: !Not [!Equals [!Ref MSKConsumerClusterArn, ""]]

Resources:
  # Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !If
        - IsProductLevel
        - !Sub '${Environment}-${DomainName}-${ProductName}-${ServiceName}'
        - !If
          - IsDomainLevel
          - !Sub '${Environment}-${DomainName}-${ServiceName}'
          - !Sub '${Environment}-${ServiceName}'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform:
        CpuArchitecture: !Ref CpuArchitecture
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !ImportValue
        Fn::Sub: '${Environment}-TaskExecutionRoleArn'
      TaskRoleArn: !If
        - IsProductLevel
        - !ImportValue
          Fn::Sub: '${Environment}-${DomainName}-${ProductName}-${ServiceName}-TaskRoleArn'
        - !If
          - IsDomainLevel
          - !ImportValue
            Fn::Sub: '${Environment}-${DomainName}-${ServiceName}-TaskRoleArn'
          - !ImportValue
            Fn::Sub: '${Environment}-${ServiceName}-TaskRoleArn'
      Volumes: !If
        - RequiresEFS
        - - Name: config-efs
            EFSVolumeConfiguration:
              FileSystemId: !If
                - IsProductLevel
                - !ImportValue
                  Fn::Sub: '${Environment}-${DomainName}-${ProductName}-${ServiceName}-EFS-FileSystemId'
                - !If
                  - IsDomainLevel
                  - !ImportValue
                    Fn::Sub: '${Environment}-${DomainName}-${ServiceName}-EFS-FileSystemId'
                  - !ImportValue
                    Fn::Sub: '${Environment}-${ServiceName}-EFS-FileSystemId'
              TransitEncryption: ENABLED
              AuthorizationConfig:
                AccessPointId: !If
                  - IsProductLevel
                  - !ImportValue
                    Fn::Sub: '${Environment}-${DomainName}-${ProductName}-${ServiceName}-EFS-AccessPointId'
                  - !If
                    - IsDomainLevel
                    - !ImportValue
                      Fn::Sub: '${Environment}-${DomainName}-${ServiceName}-EFS-AccessPointId'
                    - !ImportValue
                      Fn::Sub: '${Environment}-${ServiceName}-EFS-AccessPointId'
        - !Ref 'AWS::NoValue'
      ContainerDefinitions:
        # Main Application Container
        - Name: !Ref ServiceName
          Image: !Ref ContainerImage
          Essential: true
          Cpu: !If [IsBatchJob, !Ref TaskCpu, !Ref 'AWS::NoValue']
          Memory: !If [IsBatchJob, !Ref TaskMemory, !Ref 'AWS::NoValue']
          MemoryReservation: !If [IsBatchJob, !Ref 'AWS::NoValue', !Ref TaskMemory]
          ReadonlyRootFilesystem: !If [IsProduction, true, false]
          User: !If [IsProduction, '1001:1001', !Ref 'AWS::NoValue']
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
              Name: !Sub '${ServiceName}-port'
          MountPoints: !If
            - RequiresEFS
            - - SourceVolume: config-efs
                ContainerPath: /opt/app/config
                ReadOnly: true
            - !Ref 'AWS::NoValue'
          Environment:
            # Common environment variables
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: SERVICE_NAME
              Value: !Ref ServiceName
            - Name: DOMAIN_NAME
              Value: !If [HasDomainName, !Ref DomainName, ""]
            - Name: PRODUCT_NAME
              Value: !If [HasProductName, !Ref ProductName, ""]
            - Name: SERVICE_TYPE
              Value: !Ref ServiceType
            - Name: SERVICE_PORT
              Value: !Ref ContainerPort
            # - Name: AWS_DEFAULT_REGION
            #   Value: !Ref AWS::Region
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            # Couchbase Configuration (Optional) - Non-sensitive values only
            - !If
              - RequiresCouchbase
              - Name: COUCHBASE_ENDPOINT
                Value: !If [HasCouchbaseEndpoint, !Sub '{{resolve:ssm:${CouchbaseEndpointParam}}}', 'couchbase://localhost']
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresCouchbase
              - Name: COUCHBASE_SECRET_NAME
                Value: !If [HasCouchbaseSecret, !Ref CouchbaseSecretName, '']
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresCouchbase
              - Name: JWT_SECRET_PARAM
                Value: !If [HasJWTSecret, !Ref JWTSecretParam, '']
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresCouchbase
              - Name: COUCHBASE_BUCKET
                Value: !Ref CouchbaseBucket
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresCouchbase
              - Name: COUCHBASE_SCOPE
                Value: !Ref CouchbaseScope
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresCouchbase
              - Name: COUCHBASE_COLLECTION
                Value: !Ref CouchbaseCollection
              - !Ref 'AWS::NoValue'
            - Name: AWS_XRAY_DAEMON_ADDRESS
              Value: !If [EnableXRayDaemonSidecar, 'localhost:2000', !Ref 'AWS::NoValue']
            - Name: AWS_XRAY_TRACING_NAME
              Value: !Ref ServiceName
            # EFS Configuration
            - !If
              - RequiresEFS
              - Name: CONFIG_BASE_PATH
                Value: /opt/app/config
              - !Ref 'AWS::NoValue'
            # JVM optimization for Kafka consumers
            - !If
              - IsKafkaConsumer
              - Name: JAVA_OPTS
                Value: '-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=200'
              - !Ref 'AWS::NoValue'
            
            # Resource-based environment variables (any service type can use any resource)
            # Database environments (if NeedsDatabase=true)
            - !If
              - RequiresDatabase
              - Name: DATABASE_ENDPOINT
                Value: !If
                  - DatabaseAtProduct
                  - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/${ProductName}/database/endpoint}}'
                  - !If
                    - DatabaseAtDomain
                    - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/database/endpoint}}'
                    - !Sub '{{resolve:ssm:/${Environment}/database/endpoint}}'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresDatabase
              - Name: DATABASE_NAME
                Value: !If
                  - DatabaseAtProduct
                  - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/${ProductName}/database/name}}'
                  - !If
                    - DatabaseAtDomain
                    - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/database/name}}'
                    - !Sub '{{resolve:ssm:/${Environment}/database/name}}'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresDatabase
              - Name: DATABASE_PORT
                Value: !If
                  - DatabaseAtProduct
                  - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/${ProductName}/database/port}}'
                  - !If
                    - DatabaseAtDomain
                    - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/database/port}}'
                    - !Sub '{{resolve:ssm:/${Environment}/database/port}}'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresDatabase
              - Name: DATABASE_USER
                Value: !Ref DatabaseUser
              - !Ref 'AWS::NoValue'
            
            # Redis environments (if NeedsRedis=true)
            - !If
              - RequiresRedis
              - Name: REDIS_ENDPOINT
                Value: !If
                  - RedisAtProduct
                  - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/${ProductName}/cache/redis-endpoint}}'
                  - !If
                    - RedisAtDomain
                    - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/cache/redis-endpoint}}'
                    - !Sub '{{resolve:ssm:/${Environment}/cache/redis-endpoint}}'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresRedis
              - Name: REDIS_PORT
                Value: !If
                  - RedisAtProduct
                  - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/${ProductName}/cache/redis-port}}'
                  - !If
                    - RedisAtDomain
                    - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/cache/redis-port}}'
                    - !Sub '{{resolve:ssm:/${Environment}/cache/redis-port}}'
              - !Ref 'AWS::NoValue'
            
            # DynamoDB/DAX environments (if NeedsDynamoDB=true)
            - !If
              - RequiresDynamoDB
              - Name: DAX_ENDPOINT
                Value: !If
                  - IsProductLevel
                  - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/${ProductName}/dynamodb/dax-endpoint}}'
                  - !If
                    - IsDomainLevel
                    - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/dynamodb/dax-endpoint}}'
                    - !Sub '{{resolve:ssm:/${Environment}/dynamodb/dax-endpoint}}'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresDynamoDB
              - Name: DYNAMODB_TABLE_NAME
                Value: !If
                  - IsProductLevel
                  - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/${ProductName}/dynamodb/table-name}}'
                  - !If
                    - IsDomainLevel
                    - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/dynamodb/table-name}}'
                    - !Sub '{{resolve:ssm:/${Environment}/dynamodb/table-name}}'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresDynamoDB
              - Name: DYNAMODB_REGION
                Value: !Ref 'AWS::Region'
              - !Ref 'AWS::NoValue'
            
            # MSK environments (if NeedsMSK=true)
            - !If
              - RequiresMSK
              - Name: MSK_PRODUCER_CLUSTER_ARN
                Value: !If
                  - HasSeparateProducerMSK
                  - !Ref MSKProducerClusterArn
                  - !If
                    - MSKProducerAtProduct
                    - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/${ProductName}/messaging/msk-producer-cluster-arn}}'
                    - !If
                      - MSKProducerAtDomain
                      - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/messaging/msk-producer-cluster-arn}}'
                      - !Sub '{{resolve:ssm:/${Environment}/foundation/messaging/msk-producer-cluster-arn}}'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresMSK
              - Name: MSK_CONSUMER_CLUSTER_ARN
                Value: !If
                  - HasSeparateConsumerMSK
                  - !Ref MSKConsumerClusterArn
                  - !If
                    - MSKConsumerAtProduct
                    - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/${ProductName}/messaging/msk-consumer-cluster-arn}}'
                    - !If
                      - MSKConsumerAtDomain
                      - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/messaging/msk-consumer-cluster-arn}}'
                      - !Sub '{{resolve:ssm:/${Environment}/foundation/messaging/msk-consumer-cluster-arn}}'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresMSK
              - Name: PRODUCER_TOPIC_NAME
                Value: !Ref ProducerTopicName1
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresMSK
              - Name: CONSUMER_TOPIC_NAME
                Value: !Ref ConsumerTopicName1
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresMSK
              - Name: XRAY_TRACING_ENABLED
                Value: 'true'
              - !Ref 'AWS::NoValue'
            
            # SQS environments (if NeedsSQS=true)
            - !If
              - RequiresSQS
              - Name: SQS_QUEUE_URL
                Value: !If
                  - IsProductLevel
                  - !Sub 'https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${Environment}-${DomainName}-${ProductName}-${ServiceName}-queue'
                  - !If
                    - IsDomainLevel
                    - !Sub 'https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${Environment}-${DomainName}-${ServiceName}-queue'
                    - !Sub 'https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${Environment}-${ServiceName}-queue'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresSQS
              - Name: SQS_REGION
                Value: !Ref 'AWS::Region'
              - !Ref 'AWS::NoValue'
            
            # SNS environments (if NeedsSNS=true)
            - !If
              - RequiresSNS
              - Name: SNS_TOPIC_ARN
                Value: !If
                  - IsProductLevel
                  - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Environment}-${DomainName}-${ProductName}-${ServiceName}-topic'
                  - !If
                    - IsDomainLevel
                    - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Environment}-${DomainName}-${ServiceName}-topic'
                    - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Environment}-${ServiceName}-topic'
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresSNS
              - Name: SNS_REGION
                Value: !Ref 'AWS::Region'
              - !Ref 'AWS::NoValue'
            
            # Service-type specific environments (only for batch jobs)
            - !If
              - IsBatchJob
              - Name: BATCH_JOB_NAME
                Value: !Ref ServiceName
              - !Ref 'AWS::NoValue'
          
          Secrets:
            # Database secrets
            - !If
              - RequiresDatabase
              - Name: DATABASE_PASSWORD
                ValueFrom: !If
                  - DatabaseAtProduct
                  - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/${ProductName}/database/secret-arn}}'
                  - !If
                    - DatabaseAtDomain
                    - !Sub '{{resolve:ssm:/${Environment}/${DomainName}/database/secret-arn}}'
                    - !Sub '{{resolve:ssm:/${Environment}/database/secret-arn}}'
              - !Ref 'AWS::NoValue'
            # Couchbase secrets
            - !If
              - RequiresCouchbase
              - Name: COUCHBASE_USERNAME
                ValueFrom: !If [HasCouchbaseSecret, !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${CouchbaseSecretName}:username::', !Ref 'AWS::NoValue']
              - !Ref 'AWS::NoValue'
            - !If
              - RequiresCouchbase
              - Name: COUCHBASE_PASSWORD
                ValueFrom: !If [HasCouchbaseSecret, !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${CouchbaseSecretName}:password::', !Ref 'AWS::NoValue']
              - !Ref 'AWS::NoValue'
            # JWT Secret
            - !If
              - RequiresCouchbase
              - Name: JWT_SECRET
                ValueFrom: !If [HasJWTSecret, !Ref JWTSecretParam, !Ref 'AWS::NoValue']
              - !Ref 'AWS::NoValue'
          
          HealthCheck: !If
            - HasHTTPHealthCheck
            - Command:
                - CMD-SHELL
                - !Sub 'curl -f http://localhost:${ContainerPort}${HealthCheckPath} || exit 1'
              Interval: !If [IsKafkaConsumer, 15, 30]  # Check every 15 seconds for Kafka
              Timeout: !If [IsKafkaConsumer, 10, 10]   # 10 second timeout
              Retries: !If [IsKafkaConsumer, 2, 3]     # 2 retries for Kafka
              StartPeriod: !If [IsKafkaConsumer, 60, 120]  # 60 seconds grace period for MSK connection
            - !Ref 'AWS::NoValue'
          
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !If
                - ECSLogGroupAtProduct
                - !ImportValue
                  Fn::Sub: '${Environment}-${DomainName}-${ProductName}-ECSLogGroupName'
                - !If
                  - ECSLogGroupAtDomain
                  - !ImportValue
                    Fn::Sub: '${Environment}-${DomainName}-ECSLogGroupName'
                  - !ImportValue
                    Fn::Sub: '${Environment}-ECSLogGroupName'
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: !Ref ServiceName
        
        # X-Ray Daemon Sidecar (for non-batch services)
        - !If
          - EnableXRayDaemonSidecar
          - Name: xray-daemon
            Image: public.ecr.aws/xray/aws-xray-daemon:latest
            Essential: false
            Cpu: 32
            Memory: 256
            Environment:
              - Name: AWS_REGION
                Value: !Ref 'AWS::Region'
            Command:
              - '-o'
              - '-t'
              - '0.0.0.0:2000'
              - '-b'
              - '0.0.0.0:2000'
            PortMappings:
              - ContainerPort: 2000
                Protocol: udp
                Name: xray-udp
            LogConfiguration:
              LogDriver: awslogs
              Options:
                awslogs-group: !If
                  - ECSLogGroupAtProduct
                  - !ImportValue
                    Fn::Sub: '${Environment}-${DomainName}-${ProductName}-ECSLogGroupName'
                  - !If
                    - ECSLogGroupAtDomain
                    - !ImportValue
                      Fn::Sub: '${Environment}-${DomainName}-ECSLogGroupName'
                    - !ImportValue
                      Fn::Sub: '${Environment}-ECSLogGroupName'
                awslogs-region: !Ref 'AWS::Region'
                awslogs-stream-prefix: xray-daemon
          - !Ref 'AWS::NoValue'
      
      Tags:
        - Key: Name
          Value: !If
            - IsProductLevel
            - !Sub '${Environment}-${DomainName}-${ProductName}-${ServiceName}-task'
            - !If
              - IsDomainLevel
              - !Sub '${Environment}-${DomainName}-${ServiceName}-task'
              - !Sub '${Environment}-${ServiceName}-task'
        - Key: Environment
          Value: !Ref Environment
        - Key: Domain
          Value: !If [HasDomainName, !Ref DomainName, "foundation"]
        - Key: Product
          Value: !If [HasProductName, !Ref ProductName, ""]
        - Key: Service
          Value: !Ref ServiceName
        - Key: ServiceType
          Value: !Ref ServiceType
        - Key: Version
          Value: v1-DDD

  # ECS Service (not created for batch jobs)
  ECSService:
    Type: AWS::ECS::Service
    Condition: IsNotBatchJob
    Properties:
      ServiceName: !If
        - IsProductLevel
        - !Sub '${Environment}-${DomainName}-${ProductName}-${ServiceName}'
        - !If
          - IsDomainLevel
          - !Sub '${Environment}-${DomainName}-${ServiceName}'
          - !Sub '${Environment}-${ServiceName}'
      Cluster: !If
        - ECSClusterAtProduct
        - !ImportValue
          Fn::Sub: '${Environment}-${DomainName}-${ProductName}-ECSClusterName'
        - !If
          - ECSClusterAtDomain
          - !ImportValue
            Fn::Sub: '${Environment}-${DomainName}-ECSClusterName'
          - !ImportValue
            Fn::Sub: '${Environment}-ECSClusterName'
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref DesiredCount
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !If
              - IsProductLevel
              - !ImportValue
                Fn::Sub: '${Environment}-${DomainName}-${ProductName}-${ServiceName}-SecurityGroupId'
              - !If
                - IsDomainLevel
                - !ImportValue
                  Fn::Sub: '${Environment}-${DomainName}-${ServiceName}-SecurityGroupId'
                - !ImportValue
                  Fn::Sub: '${Environment}-${ServiceName}-SecurityGroupId'
          Subnets:
            - !ImportValue
              Fn::Sub: '${Environment}-PrivateSubnet1Id'
            - !ImportValue
              Fn::Sub: '${Environment}-PrivateSubnet2Id'
          AssignPublicIp: DISABLED
      
      ServiceConnectConfiguration: !If
        - NeedsServiceConnect
        - Enabled: true
          Namespace: !If
            - UseFoundationServiceConnectNamespace
            - !Ref FoundationServiceConnectNamespaceArn
            - !If
              - ServiceConnectAtProduct
              - !ImportValue
                Fn::Sub: '${Environment}-${DomainName}-${ProductName}-ServiceConnectNamespaceName'
              - !If
                - ServiceConnectAtDomain
                - !ImportValue
                  Fn::Sub: '${Environment}-${DomainName}-ServiceConnectNamespaceName'
                - !ImportValue
                  Fn::Sub: '${Environment}-ServiceConnectNamespaceName'
          Services: !If
            - NeedsServiceConnectPortMap
            - - PortName: !Sub '${ServiceName}-port'
                DiscoveryName: !Ref ServiceName
                ClientAliases:
                  - Port: !Ref ContainerPort
                    DnsName: !Ref ServiceName
            - []
        - Enabled: false
      
      LoadBalancers: !If
        - NeedsLoadBalancer
        - - TargetGroupArn: !If
              - IsProductLevel
              - !ImportValue
                Fn::Sub: '${Environment}-${DomainName}-${ProductName}-${ServiceName}-TargetGroupArn'
              - !If
                - IsDomainLevel
                - !ImportValue
                  Fn::Sub: '${Environment}-${DomainName}-${ServiceName}-TargetGroupArn'
                - !ImportValue
                  Fn::Sub: '${Environment}-${ServiceName}-TargetGroupArn'
            ContainerName: !Ref ServiceName
            ContainerPort: !Ref ContainerPort
        - !Ref 'AWS::NoValue'
      
      HealthCheckGracePeriodSeconds: !If [NeedsLoadBalancer, 300, !Ref 'AWS::NoValue']
      
      DeploymentConfiguration:
        MaximumPercent: !If [IsKafkaConsumer, 200, 200]  # Kafka: allow 2x for rolling updates, Others: 2x
        MinimumHealthyPercent: !If [IsKafkaConsumer, 50, 50]  # Kafka: keep 50% during deployment, Others: 50%
        DeploymentCircuitBreaker:
          Enable: true  # Enable circuit breaker for all services
          Rollback: true
      
      # Force replacement of unhealthy tasks
      PropagateTags: SERVICE
      
      EnableExecuteCommand: !If [IsProduction, false, true]
      
      Tags:
        - Key: Name
          Value: !If
            - IsProductLevel
            - !Sub '${Environment}-${DomainName}-${ProductName}-${ServiceName}-service'
            - !If
              - IsDomainLevel
              - !Sub '${Environment}-${DomainName}-${ServiceName}-service'
              - !Sub '${Environment}-${ServiceName}-service'
        - Key: Environment
          Value: !Ref Environment
        - Key: Domain
          Value: !If [HasDomainName, !Ref DomainName, "foundation"]
        - Key: Product
          Value: !If [HasProductName, !Ref ProductName, ""]
        - Key: Service
          Value: !Ref ServiceName
        - Key: ServiceType
          Value: !Ref ServiceType
        - Key: Version
          Value: v1-DDD

  # Auto Scaling Target (service-type specific)
  AutoScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: IsNotBatchJob
    DependsOn: ECSService
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Join 
        - /
        - - service
          - !If
            - ECSClusterAtProduct
            - !ImportValue
              Fn::Sub: '${Environment}-${DomainName}-${ProductName}-ECSClusterName'
            - !If
              - ECSClusterAtDomain
              - !ImportValue
                Fn::Sub: '${Environment}-${DomainName}-ECSClusterName'
              - !ImportValue
                Fn::Sub: '${Environment}-ECSClusterName'
          - !GetAtt ECSService.Name
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: !Ref MinCapacity
      MaxCapacity: !Ref MaxCapacity  # Allow auto-scaling for all service types
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'

  # CPU Scaling Policy (Kafka consumers can auto-scale based on partition load)
  CPUScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: CanScale
    DependsOn: AutoScalingTarget
    Properties:
      PolicyName: !If
        - IsProductLevel
        - !Sub '${Environment}-${DomainName}-${ProductName}-${ServiceName}-cpu-scaling'
        - !If
          - IsDomainLevel
          - !Sub '${Environment}-${DomainName}-${ServiceName}-cpu-scaling'
          - !Sub '${Environment}-${ServiceName}-cpu-scaling'
      PolicyType: TargetTrackingScaling
      ServiceNamespace: ecs
      ScalingTargetId: !Ref AutoScalingTarget
      ScalableDimension: ecs:service:DesiredCount
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !If [IsAPIService, 70, 80]  # API services: more aggressive scaling
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleOutCooldown: !If [IsAPIService, 180, 300]  # API services: faster scale out
        ScaleInCooldown: !If [IsAPIService, 300, 600]   # API services: faster scale in

  # Memory Scaling Policy
  MemoryScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: CanScale
    DependsOn: AutoScalingTarget
    Properties:
      PolicyName: !If
        - IsProductLevel
        - !Sub '${Environment}-${DomainName}-${ProductName}-${ServiceName}-memory-scaling'
        - !If
          - IsDomainLevel
          - !Sub '${Environment}-${DomainName}-${ServiceName}-memory-scaling'
          - !Sub '${Environment}-${ServiceName}-memory-scaling'
      PolicyType: TargetTrackingScaling
      ServiceNamespace: ecs
      ScalingTargetId: !Ref AutoScalingTarget
      ScalableDimension: ecs:service:DesiredCount
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !If [IsAPIService, 75, 85]  # API services: more aggressive scaling
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        ScaleOutCooldown: !If [IsAPIService, 180, 300]
        ScaleInCooldown: !If [IsAPIService, 300, 600]

Outputs:
  TaskDefinitionArn:
    Description: Task Definition ARN
    Value: !Ref TaskDefinition
    Export:
      Name: !If
        - IsProductLevel
        - !Sub '${Environment}-${DomainName}-${ProductName}-${ServiceName}-TaskDefinitionArn'
        - !If
          - IsDomainLevel
          - !Sub '${Environment}-${DomainName}-${ServiceName}-TaskDefinitionArn'
          - !Sub '${Environment}-${ServiceName}-TaskDefinitionArn'

  ECSServiceArn:
    Description: ECS Service ARN
    Value: !If [IsBatchJob, "NoService", !Ref ECSService]
    Export:
      Name: !If
        - IsProductLevel
        - !Sub '${Environment}-${DomainName}-${ProductName}-${ServiceName}-ECSServiceArn'
        - !If
          - IsDomainLevel
          - !Sub '${Environment}-${DomainName}-${ServiceName}-ECSServiceArn'
          - !Sub '${Environment}-${ServiceName}-ECSServiceArn'

  ECSServiceName:
    Description: ECS Service Name
    Value: !If 
      - IsBatchJob
      # - !Ref 'AWS::NoValue'
      - "NoService"
      - !If
        - IsProductLevel
        - !Sub '${Environment}-${DomainName}-${ProductName}-${ServiceName}'
        - !If
          - IsDomainLevel
          - !Sub '${Environment}-${DomainName}-${ServiceName}'
          - !Sub '${Environment}-${ServiceName}'
    Export:
      Name: !If
        - IsProductLevel
        - !Sub '${Environment}-${DomainName}-${ProductName}-${ServiceName}-ECSServiceName'
        - !If
          - IsDomainLevel
          - !Sub '${Environment}-${DomainName}-${ServiceName}-ECSServiceName'
          - !Sub '${Environment}-${ServiceName}-ECSServiceName'